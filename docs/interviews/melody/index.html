<body>
  <main>
    <p class="eyebrow">RESEARCH / INTERVIEW</p>

  <script>
    const audio=document.getElementById('interview'),status=document.getElementById('status');
    audio.addEventListener('loadedmetadata',()=>{const minutes=Math.floor(audio.duration/60),seconds=Math.floor(audio.duration%60);status.textContent=Number.isFinite(audio.duration)?`完整录音 · ${minutes} 分 ${String(seconds).padStart(2,'0')} 秒`:'音频已就绪'});
    audio.addEventListener('error',()=>{status.textContent='音频暂时无法加载，可稍后刷新，或通过下方链接下载收听。'});
    audio.querySelector('source').addEventListener('error',()=>{status.textContent='音频暂时无法加载，可稍后刷新，或通过下方链接下载收听。'});
